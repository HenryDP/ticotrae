<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TicoTraeCR - Compras de Amazon a Costa Rica</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="TicoTraeCR es tu mejor opción para traer productos de Amazon y otras tiendas desde Estados Unidos a Costa Rica de forma rápida y segura." />
    <meta name="keywords" content="TicoTraeCR, casillero, costa rica, compras por internet, amazon a costa rica, traer paquetes" />
    <meta name="author" content="TicoTraeCR" />
    
    <!-- Open Graph / Redes Sociales -->
    <meta property="og:title" content="TicoTraeCR - Compras de Amazon a Costa Rica" />
    <meta property="og:description" content="TicoTraeCR es tu mejor opción para traer productos de Amazon a Costa Rica de forma rápida y segura." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ticotraecr.com/" />
    <!-- Puedes añadir un og:image aquí más adelante si tienes una imagen para compartir en redes -->
    
    <!-- PWA Config -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TicoTraeCR" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
