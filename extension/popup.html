<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TicoTrae</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    .data-row { margin-bottom: 8px; }
    .label { font-weight: 600; display: block; font-size: 12px; color: #666; }
    .value { font-size: 14px; word-break: break-all; }
    img#product-image { max-width: 100%; height: auto; margin-top: 8px; border-radius: 4px;}
    button {
      width: 100%; padding: 10px; margin-top: 16px; border: none;
      border-radius: 8px; background: #2563eb; color: white;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 12px; text-align: center; font-weight: 500; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <h2>TicoTrae</h2>
  <div id="content">
    <p style="font-size: 14px; color: #666;">Buscando datos del producto...</p>
  </div>
  <button id="send-btn" disabled>Enviar a mi PWA</button>
  <div id="status"></div>
  
  <script type="module" src="popup.js"></script>
</body>
</html>
